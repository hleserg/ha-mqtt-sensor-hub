# Extra source networks allowed to reach the MQTT broker on 1883.
# One CIDR per line. Read by docker-user-lan-only.sh at apply time, so the
# boot-time systemd unit honours it as well.
#
# The LAN (192.168.1.0/24), this stack's Docker subnet (172.28.0.0/24) and
# localhost are already allowed and must not be repeated here.
#
# Intended use: a VPN client range. WireGuard on the router hands its clients
# addresses from a range of its own — put that range here, not the router's LAN
# address, and 1883 becomes reachable over the tunnel and nowhere else.
#
# After editing:
#   sudo ./firewall/docker-user-lan-only.sh apply

# WireGuard server on the router, listening on udp/41495. Clients get addresses
# from this range (the router itself is 172.16.6.1). Adding the range rather
# than individual clients means a new phone works without touching the firewall.
#
# Home Assistant on 8123 needs no rule here: it runs with host networking, so
# ufw governs it, and ufw already accepts 8123 from any source that can route
# to the host. Only the published Docker port 1883 goes through DOCKER-USER.
172.16.6.0/24
