# Алиса (yandex_smart_home): переопределения устройств. Фильтр — в UI интеграции.
# Кнопку интеграция отдаёт как devices.types.other, а «открой» Алиса понимает
# только у openable. Новый тип в Алисе — после «Обновить список устройств».
yandex_smart_home:
  entity_config:
    button.living_room_ir_blaster_cupboard_open:
      name: Шкаф
      type: devices.types.openable
    media_player.televizor:   # packages/tv.yaml
      name: Телевизор
      type: devices.types.media_device.tv
    # Боковой свет в торшере (z2m «Маленькая лампочка», eWeLink CK-BL702-AL-01).
    # Тип light: «весь свет» в комнате её берёт, «торшер» — нет (другое устройство).
    # Синонимы («маленький свет», «боковой свет»…) HA в Яндекс передать не может:
    # УДЯ принимает одно имя. Доп. названия — в приложении Дом с Алисой, у устройства.
    light.malenkaia_lampochka:
      name: Маленькая лампочка
      room: Комната
      type: devices.types.light
