# Zigbee-кнопка Lincukoo CZB01 (0xa4c13846f2241e0e), прихожая.
# z2m шлёт в .../action строку: короткое = toggle, двойное = on, долгое = off.
# Топик по friendly_name — переименуешь устройство в z2m, поправь и здесь.
#
# короткое — свет в прихожей и коридоре: горит хоть одна → гасим все, иначе включаем;
# долгое  — весь свет в квартире выкл (script.ves_svet_vykl);
# двойное — уходим/спать: весь свет, лисёнок, светомузыка, музыка на станциях, Mi TV.
#   Компы, их агенты, серверная розетка, мультиварка, камеры и кормушка — не трогаем.
automation:
  - id: hall_button
    alias: "Кнопка в прихожей"
    mode: queued
    triggers:
      - trigger: mqtt
        topic: zigbee2mqtt/0xa4c13846f2241e0e/action
    variables:
      hall: [light.prihozhaya, light.svet_v_koridore]
    actions:
      - choose:
          - conditions: "{{ trigger.payload == 'toggle' }}"
            sequence:
              - action: "light.turn_{{ 'off' if hall | select('is_state', 'on') | list else 'on' }}"
                target: { entity_id: "{{ hall }}" }
          - conditions: "{{ trigger.payload == 'off' }}"
            sequence:
              - action: script.ves_svet_vykl
          - conditions: "{{ trigger.payload == 'on' }}"
            sequence:
              - action: media_player.media_pause
                continue_on_error: true
                target:
                  entity_id:
                    - media_player.yandex_station_ff98f029d7407353fb617159
                    - media_player.yandex_station_lg0000000000001122190000a5c43d60
              # Приставка питается от телевизора: он выключен — её нет в сети,
              # команда уходит в никуда, это нормально.
              - action: remote.turn_off
                continue_on_error: true
                target: { entity_id: remote.tv_pristavka_mi_tv_stick }
              - action: media_player.turn_off
                continue_on_error: true
                target: { entity_id: media_player.tv_pristavka_mi_tv_stick_2 }
              # Кондиционер сюда не добавлять вслепую: ИК-кадр Kelon «AC Power» —
              # PowerToggle, выключенный он включит. Нужна розетка с замером тока.
              - action: script.ves_svet_vykl

script:
  ves_svet_vykl:
    alias: "Весь свет выкл"
    mode: single
    sequence:
      # Оборвать фиолетовый путь лисёнка и светомузыку, иначе они включат свет обратно
      - action: automation.turn_off
        target: { entity_id: &light_runs [automation.lisenok_nochiu_pogladili_fioletovyi_put,
                                          automation.lisenok_raduetsia_svetomuzyka,
                                          automation.svetomuzyka] }
        data: { stop_actions: true }
      - action: automation.turn_on
        target: { entity_id: *light_runs }
      - action: script.turn_off
        target: { entity_id: script.light_music_show }
      - action: mqtt.publish   # tools/pc_rgb_fader.py: отпустить подсветку компа
        data: { topic: ha/light_music/pc, payload: "off" }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.svetomuzyka }
      - variables:
          lit: >
            {{ states.light | selectattr('state', 'eq', 'on') | map(attribute='entity_id')
               | reject('eq', 'light.smart_feeder_indicator_light') | list }}
      - if: "{{ lit | count > 0 }}"
        then:
          - action: light.turn_off
            target: { entity_id: "{{ lit }}" }
