# =============================================================================
#  External RF/BLE sensors  —  sensors/<collector>/<sensor_id>/<metric>
# =============================================================================
#  Third-party sensors found on the air (433/868 MHz, BLE) are deliberately
#  kept apart from my own weather station. They are opportunistic, unowned and
#  may vanish at any time; the outdoor station is authoritative.
#
#  Entity creation is opt-in, in two stages, so that a busy RF band cannot turn
#  into hundreds of entities:
#
#    1. A collector announces what it hears, at most once a minute per device,
#       on   sensors/<collector>/_discovered/<device_id>   (NOT retained).
#       That feeds exactly one Home Assistant entity: "RF Last Discovered".
#
#    2. Nothing is created until the device is allow-listed. Enabling is done
#       from Home Assistant with script.rf_enable_sensor, which publishes a
#       retained command to  sensors/<collector>/cmd/enable . The collector
#       persists that list and only then starts publishing
#         - MQTT Discovery configs under homeassistant/...
#         - retained state under sensors/<collector>/<device_id>/<metric>
#
#  So the allow-list is enforced at the source. Home Assistant never has to
#  filter a firehose, and a collector reboot cannot resurrect entities that
#  were never enabled.
#
#  Discovery prefix is the standard `homeassistant` — see MQTT.md.
# =============================================================================

mqtt:
  sensor:
    # The survey feed. Non-retained by design: it shows what is on the air now,
    # not a permanent list.
    - name: "RF Last Discovered"
      unique_id: rf_last_discovered
      state_topic: "sensors/+/_discovered/+"
      value_template: >
        {{ value_json.device_id | default('unknown') }}
      json_attributes_topic: "sensors/+/_discovered/+"
      icon: mdi:radar
      entity_category: diagnostic
      device: &rf_collector_device
        identifiers: ["rf_ble_collector"]
        name: "RF/BLE Sensor Collector"
        manufacturer: "hleserg"
        model: "Tuya IR/RF remote (repurposed)"

    # Когда ворота последний раз добирали журнал ноды.
    #
    # `sensors/rf433/status` для этого не годится и воротами не пишется: он
    # принадлежит прошивке ноды (ESPHome birth/will), и `offline` туда ставит
    # брокер, когда нода умерла. Это хороший признак жизни НОДЫ, но про
    # cron-задачу он не знает ничего — а задача, публикующая retained `online`
    # и завершающаяся, оставила бы «в сети» навсегда даже собственный труп.
    #
    # Поэтому смерть половин ловится тремя разными вещами, и это не дублирование:
    #   нода умерла        -> `status` = offline, ставит брокер;
    #   ворота умерли      -> вот эта отметка перестаёт двигаться;
    #   умерло что угодно  -> `expire_after: 3600` на значениях, они пропадут
    #                         через час независимо от того, что написано выше.
    - name: "RF Collector Last Run"
      unique_id: rf_collector_last_run
      state_topic: "sensors/+/last_run"
      device_class: timestamp
      icon: mdi:clock-check-outline
      entity_category: diagnostic
      device: *rf_collector_device

    - name: "RF Collector Status"
      unique_id: rf_collector_status
      state_topic: "sensors/+/status"
      icon: mdi:access-point
      entity_category: diagnostic
      device: *rf_collector_device

input_text:
  # Target for script.rf_enable_sensor.
  rf_enable_collector:
    name: RF collector name
    initial: rf433
    max: 32
    icon: mdi:radio-tower

  rf_enable_device_id:
    name: RF device id to enable
    initial: ""
    max: 32
    icon: mdi:identifier

  rf_enable_alias:
    name: Alias for the enabled sensor
    initial: ""
    max: 64
    icon: mdi:tag-outline

# =============================================================================
#  Отправка пойманного кода обратно в эфир
# =============================================================================
#  Решение владельца от 2026-09-07: «хочу чтобы в HA была кнопка для отправки
#  этого сигнала». До этого дня в TODO L3 стояло его же «только пассивный
#  приём» — оно отменено, а не забыто.
#
#  Кнопок тут нет: их заводят ворота через MQTT-дискавери, по одной на каждое
#  различимое нажатие (у брелка на четыре кнопки — четыре сущности). Тело
#  запроса к ноде уезжает прямо в `payload_press`, поэтому здесь нужен ровно
#  один мост, а не одна автоматизация на прибор.
#
#  Кнопка появляется НЕ у каждого пойманного прибора, и это не сбой:
#    * плавающий код (KeeLoq, Somfy, ворота, машины) повторить нельзя в
#      принципе — счётчик живёт в брелке, а не в эфире;
#    * у обрезанного кадра нода не отдаёт сырьё: запись упёрлась в потолок
#      слота, хвост потерян, и в эфир ушёл бы обрубок пачки повторов. По замеру
#      ноды обрезанных примерно двое из пяти.
rest_command:
  rf433_send:
    # Адрес ноды прибит намеренно: он же прибит в DEPLOY.md и TODO L3, а
    # лишняя переменная тут — это ещё одно место, где адрес может разъехаться.
    url: "http://192.168.1.48/rf"
    method: POST
    content_type: "application/json"
    # Тело собрали ворота из сырья ноды и не пересобирали: у ноды нет
    # кодировщика протоколов, она принимает готовые тайминги.
    payload: "{{ body }}"
    timeout: 20
    verify_ssl: false

automation:
  - id: rf433_send_bridge
    alias: "RF433: переложить нажатие кнопки в эфир"
    description: >-
      Мост между кнопкой в HA и ручкой POST /rf на ноде. Единственный на все
      чужие приборы: что именно отправить, лежит в самом нажатии.
    mode: queued
    # Очередь, а не параллельно: на время передачи нода выключает приём, и
    # антенна у неё одна. Две одновременные отправки — это две посылки поверх
    # друг друга, то есть в эфир уходит мусор.
    max: 10
    triggers:
      - trigger: mqtt
        topic: "sensors/rf433/cmd/send/+/+"
    actions:
      - action: rest_command.rf433_send
        data:
          body: "{{ trigger.payload }}"
        response_variable: sent
      # Молчаливый отказ здесь — худший из возможных: человек нажал, ничего не
      # произошло, и он идёт проверять батарейки в чужом приборе. Нода отдаёт
      # 503, когда ей не хватает кучи на тело запроса (`max_body_now` в GET /rf
      # гуляет от нагрузки), и это надо показать, а не проглотить.
      - if:
          - condition: template
            value_template: "{{ sent.status != 200 }}"
        then:
          - action: persistent_notification.create
            data:
              title: "RF433: отправить не удалось"
              notification_id: "rf433_send_failed"
              message: >-
                Нода ответила {{ sent.status }} на {{ trigger.topic }}.
                {% if sent.status == 503 %}Не хватило памяти на тело запроса —
                это обычно проходит само, попробуйте ещё раз.{% else %}Ответ:
                {{ sent.content | default('пусто') }}{% endif %}

# --------------------------------------------------------------------------
#  Потери и шум на приёме — счётчики самой ноды, мимо шлюза.
#
#  Почему не через шлюз: он говорит только по MQTT и знает лишь то, что нода
#  успела отдать. Эти два числа — про то, чего нода НЕ отдала, и спрашивать
#  их надо у неё напрямую. Отдельная ответственность — отдельная дорога.
#
#  Три числа в шапке `/rf/captured` легко перепутать, поэтому здесь только
#  два, и оба названы тем, что они значат:
#
#  * `missed` — единственное, что означает «данные пропали»: кадр вытеснили
#    из восьми слотов RAM раньше, чем зеркало записало его во флеш. Ноль —
#    правильное значение, любой рост стоит разбора.
#  * `noise_overflows` — буфер рёбер набился без единой паузы и выброшен
#    целиком. Это не кадр, а сплошной фон, который приёмник ПРАВИЛЬНО не
#    записал. Число информационное: растёт — эфир шумит; а вот падение в
#    ноль означало бы, что приёмник умер, и без счётчика «тихо» и «сдох»
#    выглядят одинаково.
#
#  Третье, `dropped`, здесь сознательно НЕ выведено. Оно считает вытеснения
#  из кольца на восемь слотов и растёт на каждом кадре после первых восьми —
#  то есть тревога по нему срабатывала бы всегда и не значила бы ничего.
#  Я на нём как раз и ошибся, приняв штатную ротацию за потери.
#
#  Все три сбрасываются при перезагрузке ноды.
#
#  `limit=1` — чтобы в ответе была шапка, а не журнал: 268 байт против пары
#  десятков килобайт. Нужны только заголовки.
rest:
  - resource: "http://192.168.1.48/rf/captured?limit=1"
    scan_interval: 300
    timeout: 10
    sensor:
      - name: "RF Collector Frames Missed"
        unique_id: rf433_frames_missed
        value_template: "{{ value_json.missed }}"
        state_class: total_increasing
        icon: mdi:alert-octagon-outline
      - name: "RF Collector Noise Overflows"
        unique_id: rf433_noise_overflows
        value_template: "{{ value_json.noise_overflows }}"
        state_class: total_increasing
        icon: mdi:waveform
