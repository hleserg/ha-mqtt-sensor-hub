# =============================================================================
#  Батарея садится — станции говорят «надо подзарядить, осталось N процентов»
# =============================================================================
#  Лисёнок (sensor.lisenok_zariad) и мобильник (sensor.mobilnik_battery_level_2;
#  sensor.mobilnik_battery_level — старая регистрация того же телефона, молчит).
#  Говорят, когда заряд опускается до 20, 15, 10 и 5 %. Заряд лисёнка считается
#  по напряжению и скачет на ±2,3 %, поэтому одно устройство говорит не чаще
#  раза в час. Ночью (00–08) молчат, как алерты компов в hosts.yaml.
#  На зарядке молчат: мобильник — по sensor.mobilnik_battery_state_2, лисёнок —
#  по росту напряжения (своего датчика зарядки у него нет).
#  Малинка (BetaPi на UPS) — на тех же порогах, только без сети, раз в 10 мин и
#  ночью тоже: на батарее её хватает ненадолго.
# =============================================================================

automation:
  - id: battery_speak_lisenok
    alias: Батарея лисёнка — сказать голосом
    triggers:
      - trigger: state
        entity_id: sensor.lisenok_zariad
    conditions:
      - &crossed_down
        "{{ trigger.from_state is not none and is_number(trigger.from_state.state)
            and is_number(trigger.to_state.state)
            and [20, 15, 10, 5] | select('ge', trigger.to_state.state | float)
                | select('lt', trigger.from_state.state | float) | list | count > 0 }}"
      - &hourly_by_day
        "{{ (this.attributes.last_triggered is none
             or now() - this.attributes.last_triggered > timedelta(hours=1))
            and now().hour >= 8 }}"
      - "{{ is_state('binary_sensor.lisenok_zariazhaetsia', 'off') }}"
    actions:
      - action: script.battery_low_say
        data:
          who: Лисёнка
          level: "{{ trigger.to_state.state | float | round(0) | int }}"

  - id: battery_speak_mobilnik
    alias: Батарея мобильника — сказать голосом
    triggers:
      - trigger: state
        entity_id: sensor.mobilnik_battery_level_2
    conditions:
      - *crossed_down
      - *hourly_by_day
      - "{{ not is_state('sensor.mobilnik_battery_state_2', ['charging', 'full']) }}"
    actions:
      - action: script.battery_low_say
        data:
          who: Мобильник
          level: "{{ trigger.to_state.state | int }}"

  - id: battery_speak_betapi
    alias: Батарея малинки — сказать голосом
    triggers:
      - trigger: state
        entity_id: sensor.betapi_battery_pct
    conditions:
      - *crossed_down
      - "{{ this.attributes.last_triggered is none
            or now() - this.attributes.last_triggered > timedelta(minutes=10) }}"
      - "{{ is_state('binary_sensor.betapi_ac_ok', 'off') }}"
    actions:
      - action: script.battery_low_say
        data:
          who: Малинка
          what: без сети
          level: "{{ trigger.to_state.state | float | round(0) | int }}"

binary_sensor:
  # Заряжают — напряжение растёт: на включении зарядки сразу скачок на ~0,1 В,
  # потом рост. Разряд — падает, шум ±0,02 В за 10 мин усредняется.
  - platform: trend
    sensors:
      lisenok_zariazhaetsia:
        friendly_name: Лисёнок заряжается
        unique_id: lisenok_zariazhaetsia
        entity_id: sensor.lisenok_napriazhenie_batarei
        sample_duration: 600
        max_samples: 40
        min_samples: 4
        min_gradient: 0.00003   # В/с ≈ 0,1 В/ч

script:
  battery_low_say:
    alias: Батарея — сказать, что пора заряжать
    mode: queued
    fields:
      who:
        description: Кого заряжать, в винительном падеже
      what:
        description: Что сказать вместо «надо подзарядить» (тогда who — в именительном)
      level:
        description: Сколько процентов осталось
    variables:
      unit: >-
        {% set n = level | int %}
        {{ 'процент' if n % 10 == 1 and n % 100 != 11
           else 'процента' if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14]
           else 'процентов' }}
    sequence:
      - action: media_player.play_media
        target:
          entity_id:
            - media_player.yandex_station_ff98f029d7407353fb617159
            - media_player.yandex_station_lg0000000000001122190000a5c43d60
        data:
          media_content_type: text
          media_content_id: "{{ who }} {{ what | default('надо подзарядить') }}, осталось {{ level }} {{ unit }}."
