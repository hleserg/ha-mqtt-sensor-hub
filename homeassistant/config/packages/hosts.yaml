# =============================================================================
#  Компьютеры стека: doctor, mc-server, bigpc (Windows), mac-mini (macOS)
# =============================================================================
#  Данные шлёт tools/host_mqtt.py на каждой машине в own/<host>/<metric>
#  (MQTT.md §14). BetaPi — тот же скрипт, но свой пакет betapi.yaml.
#  Температур CPU нет на bigpc и mac-mini: без LibreHardwareMonitor / root-доступа
#  к powermetrics их не достать. Видеокарта bigpc (NVIDIA) — через nvidia-smi.
#  Диск doctor уже меряет monitoring.yaml (sensor.doctor_disk_used_percent) —
#  здесь не дублируется.
#
#  Алерты — template event; их озвучивает hosts_alert_speak на станциях.
#  В yandex_smart_home их нет (убраны 02.10).
#  Пороги — в триггерах ниже.
# =============================================================================
mqtt:
  binary_sensor:
  - name: doctor онлайн
    unique_id: doctor_online
    default_entity_id: binary_sensor.doctor_online
    state_topic: own/doctor/status
    payload_on: online
    payload_off: offline
    device_class: connectivity
    device:
      identifiers:
      - own_doctor
      name: doctor
      model: HA / iot-stack, Ubuntu 24.04
  - name: mc-server онлайн
