    unit_of_measurement: '%'
    state_class: measurement
    icon: mdi:chip
    availability_topic: own/doctor/status
    expire_after: 180
    device:
      identifiers:
      - own_doctor
      name: doctor
      model: HA / iot-stack, Ubuntu 24.04
  - name: doctor память занята
    unique_id: doctor_ram_used_pct
    default_entity_id: sensor.doctor_ram_used_pct
    state_topic: own/doctor/ram_used_pct
    unit_of_measurement: '%'
    state_class: measurement
    icon: mdi:memory
    availability_topic: own/doctor/status
    expire_after: 180
    device:
      identifiers:
      - own_doctor
      name: doctor
      model: HA / iot-stack, Ubuntu 24.04
  - name: doctor температура CPU
    unique_id: doctor_cpu_temperature
    default_entity_id: sensor.doctor_cpu_temperature
    state_topic: own/doctor/cpu_temperature
    unit_of_measurement: °C
    state_class: measurement
    icon: mdi:thermometer
