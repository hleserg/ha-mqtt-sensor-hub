# Алерты. Озвучивает hosts_alert_speak ниже.
# Хост, который всё ещё лежит после рестарта HA, напомнит о себе ещё раз — это нормально.
# «doctor пропал» не делаем: HA живёт на нём и упадёт вместе с ним.
template:
  # ---------------------------------------------------------- пропал из сети
  # Ребут ~1–2 мин, поэтому 3 минуты; mc-server грузится дольше — 5; у mac-mini Wi-Fi моргает — 10.
  # Без from: "on" — иначе рестарт HA (off → unavailable → off) теряет алерт.
  - triggers:
      - trigger: state
        entity_id: binary_sensor.mc_server_online
        to: "off"
        for: {minutes: 5}
    event:
      - name: "mc-server: пропал из сети"
        unique_id: mc_server_alert_offline
        default_entity_id: event.mc_server_alert_offline
        device_class: button
        event_types: "{{ ['click'] }}"
        event_type: "click"
  - triggers:
      - trigger: state
        entity_id: binary_sensor.bigpc_online
        to: "off"
        for: {minutes: 3}
    event:
      - name: "bigpc: пропал из сети"
        unique_id: bigpc_alert_offline
        default_entity_id: event.bigpc_alert_offline
        device_class: button
        event_types: "{{ ['click'] }}"
        event_type: "click"
  - triggers:
      - trigger: state
        entity_id: binary_sensor.mac_mini_online
        to: "off"
        for: {minutes: 10}
    event:
      - name: "mac-mini: пропал из сети"
        unique_id: mac_mini_alert_offline
        default_entity_id: event.mac_mini_alert_offline
        device_class: button
        event_types: "{{ ['click'] }}"
        event_type: "click"

  # ------------------------------------------------------- кончается место
  - triggers:
      - trigger: numeric_state
        entity_id: sensor.doctor_disk_used_percent
        above: 90
        for: {minutes: 10}
    conditions:
      - "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    event:
      - name: "doctor: кончается место"
        unique_id: doctor_alert_disk_full
        default_entity_id: event.doctor_alert_disk_full
        device_class: button
        event_types: "{{ ['click'] }}"
        event_type: "click"
  - triggers:
      - trigger: numeric_state
        entity_id: sensor.mc_server_disk_used_pct
        above: 90
        for: {minutes: 10}
    conditions:
      - "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    event:
      - name: "mc-server: кончается место"
        unique_id: mc_server_alert_disk_full
        default_entity_id: event.mc_server_alert_disk_full
        device_class: button
        event_types: "{{ ['click'] }}"
        event_type: "click"
  - triggers:
      - trigger: numeric_state
        entity_id: sensor.bigpc_disk_used_pct
        above: 90
        for: {minutes: 10}
    conditions:
      - "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    event:
      - name: "bigpc: кончается место"
        unique_id: bigpc_alert_disk_full
        default_entity_id: event.bigpc_alert_disk_full
        device_class: button
        event_types: "{{ ['click'] }}"
        event_type: "click"
  - triggers:
      - trigger: numeric_state
        entity_id: sensor.mac_mini_disk_used_pct
        above: 90
        for: {minutes: 10}
    conditions:
      - "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    event:
      - name: "mac-mini: кончается место"
        unique_id: mac_mini_alert_disk_full
        default_entity_id: event.mac_mini_alert_disk_full
        device_class: button
        event_types: "{{ ['click'] }}"
        event_type: "click"

  # --------------------------------------------------------------- перегрев
  # Intel/AMD начинают сбрасывать частоту у ~95–100 °C, NVMe — с ~80 °C.
  - triggers:
      - trigger: numeric_state
        entity_id: sensor.doctor_cpu_temperature
        above: 85
        for: {minutes: 5}
    conditions:
      - "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    event:
      - name: "doctor: перегрев"
        unique_id: doctor_alert_overheat
        default_entity_id: event.doctor_alert_overheat
        device_class: button
        event_types: "{{ ['click'] }}"
        event_type: "click"
  - triggers:
      - trigger: numeric_state
        entity_id: sensor.mc_server_cpu_temperature
        above: 85
        for: {minutes: 5}
      - trigger: numeric_state
        entity_id: sensor.mc_server_nvme_temperature
        above: 70
        for: {minutes: 5}
    conditions:
      - "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    event:
      - name: "mc-server: перегрев"
        unique_id: mc_server_alert_overheat
        default_entity_id: event.mc_server_alert_overheat
        device_class: button
        event_types: "{{ ['click'] }}"
        event_type: "click"

# Алерт -> Алиса говорит сама, без сценариев в приложении Яндекса. Ночью
# (00–08) молчит, кроме пропажи света и перегрева; уведомление в HA — всегда.
automation:
  - id: hosts_alert_speak
    alias: "Компы: алерт голосом Алисы"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - event.mc_server_alert_offline
          - event.bigpc_alert_offline
          - event.mac_mini_alert_offline
          - event.doctor_alert_disk_full
          - event.mc_server_alert_disk_full
          - event.bigpc_alert_disk_full
          - event.mac_mini_alert_disk_full
          - event.doctor_alert_overheat
          - event.mc_server_alert_overheat
          - event.betapi_alert_power_lost
          - event.betapi_alert_battery_low
          - event.betapi_alert_disk_full
          - event.betapi_alert_overheat
          - event.betapi_alert_offline
        not_from: unavailable
        not_to: unavailable
    conditions:
      - "{{ trigger.from_state is not none }}"
    variables:
      name: "{{ trigger.to_state.name }}"
      text: >-
        {{ name | replace('mc-server', 'эм си сервер') | replace('bigpc', 'большой комп')
           | replace('mac-mini', 'мак мини') | replace('doctor', 'доктор')
           | replace('BetaPi', 'бета пай') | replace(':', ',') }}
      urgent: "{{ trigger.entity_id.endswith(('power_lost', 'overheat', 'battery_low')) }}"
    actions:
      - action: persistent_notification.create
        data:
          title: "{{ name }}"
          message: "{{ now().strftime('%d.%m %H:%M') }}"
      - if: "{{ urgent or now().hour >= 8 }}"
        then:
          - action: media_player.play_media
            target:
              entity_id:
                - media_player.yandex_station_ff98f029d7407353fb617159
                - media_player.yandex_station_lg0000000000001122190000a5c43d60
            data:
              media_content_type: text
              media_content_id: "Внимание. {{ text }}"
