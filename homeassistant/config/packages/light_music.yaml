# =============================================================================
#  Светомузыка: «Алиса, включи светомузыку»
# =============================================================================
#  input_boolean.svetomuzyka выставлен в Алису устройством «Светомузыка».
#  Включили — HA берёт станцию, которая последней слушала (≤ 60 с назад; иначе
#  Мини), и свет её комнаты: Комната — 4 лампы «Пиратской люстры», каждая своим
#  цветом, бегущими огнями (1+3, потом 2+4); гасит z2m-группа «Пиратская люстра
#  группа». Кухня — «Кухня люстра 1» (остальные там только вкл/выкл).
#  Станция играет — музыку не трогает, только свет; молчит 5 с — «включи мою волну».
#  На каждый трек берёт у Deezer темп и жанр: на каждый удар половина ламп
#  меняет цвет и вспыхивает или гаснет; быстрое/жёсткое — резко и через цвет,
#  среднее — с переходом, спокойное — синие и тёплые, тусклее.
#  Нет темпа — по жанру. В комнате с ними подсветка компа (tools/pc_rgb_fader.py).
#  Яркость по громкости станции: тише музыка — тусклее свет.
#  Станция не играет 3 с (пауза, стоп) или выключили устройство — свет как был.
#  «Алиса, выключи светомузыку» Алиса понимает как «выключи музыку» и ставит
#  паузу; станция не играет 3 с — светомузыка гаснет за ней.
#  Удары не ловятся: станция не отдаёт звук. Темп верный, фаза — нет.
# =============================================================================

input_boolean:
  svetomuzyka:
    name: Светомузыка
    icon: mdi:music-circle

rest_command:
  deezer:
    url: "https://api.deezer.com/{{ path }}"
    method: get
    timeout: 10

template:
  - triggers:
      - trigger: state
        entity_id:
          - media_player.yandex_station_ff98f029d7407353fb617159
          - media_player.yandex_station_lg0000000000001122190000a5c43d60
        attribute: alice_state
        to: LISTENING
    sensor:
      - name: Алиса слушала
        unique_id: alice_last_heard
        icon: mdi:ear-hearing
        state: "{{ trigger.entity_id }}"
        attributes:
          at: "{{ now().isoformat() }}"

automation:
  - id: light_music
    alias: Светомузыка
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.svetomuzyka
        to: "on"
    actions:
      - variables:
          mini: media_player.yandex_station_ff98f029d7407353fb617159
          heard_at: "{{ state_attr('sensor.alisa_slushala', 'at') }}"
          station: >-
            {{ states('sensor.alisa_slushala')
               if heard_at and now() - as_datetime(heard_at) < timedelta(seconds=60)
               else mini }}
          kitchen: "{{ station != mini }}"
          # Group for the stop: one groupcast reaches lamp 1, unicasts it drops.
          target: "{{ 'light.kuhnya_lyustra_1' if kitchen else 'light.piratskaia_liustra_gruppa' }}"
          lamps: >-
            {{ ['light.kuhnya_lyustra_1'] if kitchen else
               ['light.piratskaya_lyustra_1', 'light.piratskaya_lyustra_2',
                'light.piratskaya_lyustra_3', 'light.piratskaya_lyustra_4'] }}
          was_off: "{{ lamps | select('is_state', 'on') | list | count == 0 }}"
          # Big PC's backlight (OpenRGB over LAN) joins in the room; off PC — skipped.
          extra: >-
            {{ [] if kitchen or states('light.podsvetka_kompa') in ['unavailable', 'unknown']
               else ['light.podsvetka_kompa'] }}
      - action: scene.create
        data:
          scene_id: light_music_before
          snapshot_entities: "{{ lamps + extra }}"
      # Alice pauses the music while she listens: give it 5 s to resume.
      - wait_template: "{{ is_state(station, 'playing') }}"
        timeout: 5
      - if: "{{ not wait.completed }}"
        then:
          - action: media_player.play_media
            target: { entity_id: "{{ station }}" }
            data:
              media_content_type: command
              media_content_id: включи мою волну
          - wait_template: "{{ is_state(station, 'playing') }}"
            timeout: 20
      - repeat:
          while: "{{ is_state('input_boolean.svetomuzyka', 'on') }}"
          sequence:
            - variables:
                title: "{{ state_attr(station, 'media_title') or '' }}"
                q: "{{ (state_attr(station, 'media_artist') or '') ~ ' ' ~ title }}"
            - action: rest_command.deezer
              data: { path: "search?limit=1&q={{ q | urlencode }}" }
              response_variable: found
              continue_on_error: true
            - variables:
                tid: >-
                  {{ (found.content.data | default([]) | first | default({})).id | default(0)
                     if found is defined and found.content is mapping else 0 }}
            # Not found → track/0, album/0 answer {"error": …}: bpm 0, no genre.
            - action: rest_command.deezer
              data: { path: "track/{{ tid }}" }
              response_variable: track
              continue_on_error: true
            - action: rest_command.deezer
              data:
                path: >-
                  album/{{ track.content.album.id | default(0)
                           if track is defined and track.content is mapping else 0 }}
              response_variable: album
              continue_on_error: true
            - variables:
                bpm: >-
                  {{ track.content.bpm | default(0) | float(0)
                     if track is defined and track.content is mapping else 0 }}
                genres: >-
                  {{ album.content.genres.data | default([]) | map(attribute='name')
                     | join(' ') | lower
                     if album is defined and album.content is mapping else '' }}
                hard: >-
                  {{ ['dance', 'electro', 'techno', 'house', 'rock', 'metal', 'rap',
                      'hip hop', 'punk', 'drum', 'alternative'] | select('in', genres) | list | count > 0 }}
                soft: >-
                  {{ ['classical', 'jazz', 'blues', 'soul', 'ambient', 'chill', 'relax',
                      'folk', 'r&b', 'films', 'kids'] | select('in', genres) | list | count > 0 }}
                # Deezer often doubles slow songs (Norah Jones 176.7): halve unless the genre is hard.
                tempo: "{{ bpm / 2 if bpm > 140 and not hard else bpm }}"
                style: >-
                  {{ 'energy' if tempo >= 118 or (hard and (tempo == 0 or tempo >= 95))
                     else 'calm' if (0 < tempo < 90) or (soft and tempo < 110)
                     else 'mid' }}
                # One groupcast per tick. Groupcasts are broadcasts and the Ember
                # broadcast table fills up: measured 0/28 lost at 0.7 s, 9/40 at
                # 0.5 s. Faster beats get every second one.
                beat: >-
                  {% set b = 60 / tempo if tempo > 0 else
                       (0.7 if style == 'energy' else 0.8 if style == 'mid' else 0.9) %}
                  {{ b * 2 if b < 0.7 else b }}
            - action: script.turn_on
              target: { entity_id: script.light_music_show }
              data:
                variables:
                  lamps: "{{ lamps }}"
                  station: "{{ station }}"
                  style: "{{ style }}"
                  period: "{{ beat | round(3) }}"
                  pc: "{{ extra | count > 0 }}"
            - action: logbook.log
              data:
                name: Светомузыка
                message: "{{ q }} — {{ bpm }} BPM (темп {{ tempo }}), {{ genres or 'жанр ?' }}, {{ style }}"
            - wait_for_trigger:
                - trigger: state
                  entity_id: input_boolean.svetomuzyka
                  to: "off"
                - trigger: template
                  id: track
                  value_template: "{{ (state_attr(station, 'media_title') or '') != title }}"
                - trigger: template
                  value_template: "{{ not is_state(station, 'playing') }}"
                  for: 3
              timeout: "00:15:00"
            # A track started from the phone shows up as "paused" with the new
            # title for a moment, then plays.
            - if: "{{ wait.trigger and wait.trigger.id == 'track' }}"
              then:
                - wait_template: "{{ is_state(station, 'playing') }}"
                  timeout: 5
            - if: "{{ not is_state(station, 'playing') }}"
              then:
                - action: input_boolean.turn_off
                  target: { entity_id: input_boolean.svetomuzyka }
      - action: script.turn_off
        target: { entity_id: script.light_music_show }
      - action: mqtt.publish
        data: { topic: ha/light_music/pc, payload: "off" }
      # Two passes: lamp 1 has a weak link and drops unicasts under load;
      # a groupcast off reaches it.
      - repeat:
          count: 2
          sequence:
            - delay: 2
            - action: scene.turn_on
              target: { entity_id: scene.light_music_before }
              continue_on_error: true
            - if: "{{ was_off }}"
              then:
                - action: light.turn_off
                  target: { entity_id: "{{ target }}" }

script:
  light_music_show:
    alias: Светомузыка — цвета
    mode: restart
    fields:
      lamps:
        description: Лампы — свой цвет у каждой
      station:
        description: Станция — по её громкости яркость
      style:
        description: energy, mid или calm
      period:
        description: Секунд между командами
      pc:
        description: Слать такты подсветке компа (tools/pc_rgb_fader.py)
    sequence:
      - variables:
          hues: >-
            {{ [200, 215, 230, 250, 270, 290, 310, 330, 15, 30, 15, 330, 300, 260, 230]
               if style == 'calm' else [0, 30, 55, 120, 180, 220, 280, 320] }}
      # ponytail: 2000 тактов ≈ 20–30 мин — страховка, если автоматизация не остановит.
      - repeat:
          count: 2000
          sequence:
            - variables:
                i: "{{ repeat.index }}"
                # Running lights: per beat lamps 1+3, then 2+4, each its own colour.
                # Two unicasts per beat is what the mesh holds; four got lost and
                # arrived after the stop (lamp 1 stayed on).
                half: >-
                  {{ ([0, 2] if i % 2 else [1, 3]) if lamps | count == 4
                     else range(lamps | count) | list }}
                # Each half goes bright, then dim, on its own turns.
                hi: "{{ ((i // 2) % 2 if lamps | count == 4 else i % 2) == 1 }}"
                # Louder — brighter: volume 0.6 gives 82 % of the base (owner: 15–20 % dimmer).
                dim: "{{ (state_attr(station, 'volume_level') or 0.6) | float(0.6) * 1.37 }}"
            # Fast songs: one groupcast per beat recalls a scene the lamps hold
            # (script.light_music_scenes) — all four change at once, no unicast
            # waits for a reply. Unicasts timed out on lamps 1 and 3, queued up,
            # and the light lagged the music (owner: «тормозит»).
            - if: "{{ style == 'energy' and lamps | count == 4 }}"
              then:
                - action: mqtt.publish
                  data:
                    # Bare number: a JSON template would be parsed into a dict.
                    topic: zigbee2mqtt/Пиратская люстра группа/set/scene_recall
                    payload: "{{ (i - 1) % 8 + 1 }}"
              else:
                - repeat:
                    for_each: "{{ half }}"
                    sequence:
                      - action: light.turn_on
                        target: { entity_id: "{{ lamps[repeat.item] }}" }
                        data:
                          # k counts this lamp's own changes; offsets keep the four apart.
                          hs_color: >-
                            {% set k = i // 2 if lamps | count == 4 else i %}
                            {{ [hues[(k + 3 * repeat.item) % hues | count] if style == 'calm'
                                else hues[(k * 3 + 2 * repeat.item) % hues | count],
                                70 if style == 'calm' else 100] }}
                          # The flash is what reads as "to the music" (owner: without it
                          # the lights stopped reacting). Colour-only cut no z2m timeouts.
                          brightness_pct: >-
                            {% set base = (40 if hi else 20) if style == 'calm'
                                 else (60 if hi else 35) if style == 'mid'
                                 else (70 if hi else 25) %}
                            {{ [3, [100, (base * dim) | round(0) | int] | min] | max }}
                          transition: "{{ (period / 2) | round(2) if style != 'energy' else 0 }}"
            # The PC backlight fades itself between beats (tools/pc_rgb_fader.py):
            # HA's OpenRGB call takes 0.6 s and can't keep the beat. It gets
            # «hue sat bright period», a colour of its own each beat. Brighter
            # than the lamps (owner: «можно поярче»).
            - if: "{{ pc | default(false) }}"
              then:
                - action: mqtt.publish
                  data:
                    topic: ha/light_music/pc
                    payload: >-
                      {{ hues[(i * (1 if style == 'calm' else 3)) % hues | count] }}
                      {{ 70 if style == 'calm' else 100 }}
                      {{ [100, ((75 if style == 'calm' else 100) * dim * 1.4) | round(0) | int] | min }}
                      {{ period }}
            - delay:
                milliseconds: "{{ (period | float * 1000) | int }}"

  light_music_scenes:
    alias: Светомузыка — записать сцены в люстру
    # Запустить один раз (и после замены лампы): ~1 мин, люстра мигает.
    # Сцены 1–8 группы 2 хранят лампы; бегущие огни для быстрых песен.
    # ponytail: яркость зашита (громкость 0,6); тише/громче быстрые не меняются.
    # Цвет в сцену лампы берут только свой текущий (scene_store): scene_add с
    # цветом они принимают, но вызывают одну яркость.
    sequence:
      - repeat:
          for_each: [1, 2, 3, 4, 5, 6, 7, 8]
          sequence:
            - variables:
                sc: "{{ repeat.item }}"
            - repeat:
                for_each: [0, 1, 2, 3]
                sequence:
                  - action: light.turn_on
                    target: { entity_id: "light.piratskaya_lyustra_{{ repeat.item + 1 }}" }
                    data:
                      hs_color: "{{ [[0, 30, 55, 120, 180, 220, 280, 320][(sc * 3 + 2 * repeat.item) % 8], 100] }}"
                      brightness_pct: "{{ 57 if (sc + repeat.item) % 2 == 0 else 21 }}"
                      transition: 0
                  - delay: { milliseconds: 1200 }
            - delay: { milliseconds: 1500 }
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/Пиратская люстра группа/set
                payload: '{"scene_store": {"ID": {{ sc }}, "name": "lm{{ sc }}"}}'
            - delay: 2
