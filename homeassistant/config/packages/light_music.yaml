# =============================================================================
#  Светомузыка: «Алиса, включи светомузыку»
# =============================================================================
#  input_boolean.svetomuzyka выставлен в Алису устройством «Светомузыка».
#  Включили — HA берёт станцию, которая последней слушала (≤ 60 с назад; иначе
#  Мини), и свет её комнаты: Комната — z2m-группа «Пиратская люстра группа»
#  (одна команда на 4 лампы), Кухня — «Кухня люстра 1» (остальные там только вкл/выкл).
#  Станция играет — музыку не трогает, только свет; молчит 5 с — «включи мою волну».
#  На каждый трек берёт у Deezer темп и жанр: быстрое/жёсткое — новый цвет и
#  вспышка на каждый удар, среднее — смена цвета на удар с переходом, спокойное —
#  то же по синим и тёплым, тусклее. Яркость дышит в такт. Нет темпа — по жанру.
#  Яркость по громкости станции: тише музыка — тусклее свет.
#  Станция не играет 3 с (пауза, стоп) или выключили устройство — свет как был.
#  «Алиса, выключи светомузыку» Алиса понимает как «выключи музыку» и ставит
#  паузу — фразу перехватывает сценарий в приложении Яндекса (делает владелец).
#  Удары не ловятся: станция не отдаёт звук. Темп верный, фаза — нет.
# =============================================================================

input_boolean:
  svetomuzyka:
    name: Светомузыка
    icon: mdi:music-circle

rest_command:
  deezer:
    url: "https://api.deezer.com/{{ path }}"
    method: get
    timeout: 10

template:
  - triggers:
      - trigger: state
        entity_id:
          - media_player.yandex_station_ff98f029d7407353fb617159
          - media_player.yandex_station_lg0000000000001122190000a5c43d60
        attribute: alice_state
        to: LISTENING
    sensor:
      - name: Алиса слушала
        unique_id: alice_last_heard
        icon: mdi:ear-hearing
        state: "{{ trigger.entity_id }}"
        attributes:
          at: "{{ now().isoformat() }}"

automation:
  - id: light_music
    alias: Светомузыка
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.svetomuzyka
        to: "on"
    actions:
      - variables:
          mini: media_player.yandex_station_ff98f029d7407353fb617159
          heard_at: "{{ state_attr('sensor.alisa_slushala', 'at') }}"
          station: >-
            {{ states('sensor.alisa_slushala')
               if heard_at and now() - as_datetime(heard_at) < timedelta(seconds=60)
               else mini }}
          kitchen: "{{ station != mini }}"
          # Not light.piratskaya_lyustra: that template light sends 4 unicasts per
          # tick, z2m drops some and delivers the rest after the stop.
          target: "{{ 'light.kuhnya_lyustra_1' if kitchen else 'light.piratskaia_liustra_gruppa' }}"
          lamps: >-
            {{ ['light.kuhnya_lyustra_1'] if kitchen else
               ['light.piratskaya_lyustra_1', 'light.piratskaya_lyustra_2',
                'light.piratskaya_lyustra_3', 'light.piratskaya_lyustra_4'] }}
          was_off: "{{ lamps | select('is_state', 'on') | list | count == 0 }}"
      - action: scene.create
        data:
          scene_id: light_music_before
          snapshot_entities: "{{ lamps }}"
      # Alice pauses the music while she listens: give it 5 s to resume.
      - wait_template: "{{ is_state(station, 'playing') }}"
        timeout: 5
      - if: "{{ not wait.completed }}"
        then:
          - action: media_player.play_media
            target: { entity_id: "{{ station }}" }
            data:
              media_content_type: command
              media_content_id: включи мою волну
          - wait_template: "{{ is_state(station, 'playing') }}"
            timeout: 20
      - repeat:
          while: "{{ is_state('input_boolean.svetomuzyka', 'on') }}"
          sequence:
            - variables:
                title: "{{ state_attr(station, 'media_title') or '' }}"
                q: "{{ (state_attr(station, 'media_artist') or '') ~ ' ' ~ title }}"
            - action: rest_command.deezer
              data: { path: "search?limit=1&q={{ q | urlencode }}" }
              response_variable: found
              continue_on_error: true
            - variables:
                tid: >-
                  {{ (found.content.data | default([]) | first | default({})).id | default(0)
                     if found is defined and found.content is mapping else 0 }}
            # Not found → track/0, album/0 answer {"error": …}: bpm 0, no genre.
            - action: rest_command.deezer
              data: { path: "track/{{ tid }}" }
              response_variable: track
              continue_on_error: true
            - action: rest_command.deezer
              data:
                path: >-
                  album/{{ track.content.album.id | default(0)
                           if track is defined and track.content is mapping else 0 }}
              response_variable: album
              continue_on_error: true
            - variables:
                bpm: >-
                  {{ track.content.bpm | default(0) | float(0)
                     if track is defined and track.content is mapping else 0 }}
                genres: >-
                  {{ album.content.genres.data | default([]) | map(attribute='name')
                     | join(' ') | lower
                     if album is defined and album.content is mapping else '' }}
                hard: >-
                  {{ ['dance', 'electro', 'techno', 'house', 'rock', 'metal', 'rap',
                      'hip hop', 'punk', 'drum', 'alternative'] | select('in', genres) | list | count > 0 }}
                soft: >-
                  {{ ['classical', 'jazz', 'blues', 'soul', 'ambient', 'chill', 'relax',
                      'folk', 'r&b', 'films', 'kids'] | select('in', genres) | list | count > 0 }}
                # Deezer often doubles slow songs (Norah Jones 176.7): halve unless the genre is hard.
                tempo: "{{ bpm / 2 if bpm > 140 and not hard else bpm }}"
                style: >-
                  {{ 'energy' if tempo >= 118 or (hard and (tempo == 0 or tempo >= 95))
                     else 'calm' if (0 < tempo < 90) or (soft and tempo < 110)
                     else 'mid' }}
                # One groupcast per tick. Groupcasts are broadcasts and the Ember
                # broadcast table fills up: measured 0/28 lost at 0.7 s, 9/40 at
                # 0.5 s. Faster beats get every second one.
                beat: >-
                  {% set b = 60 / tempo if tempo > 0 else
                       (0.7 if style == 'energy' else 0.8 if style == 'mid' else 0.9) %}
                  {{ b * 2 if b < 0.7 else b }}
            - action: script.turn_on
              target: { entity_id: script.light_music_show }
              data:
                variables:
                  target: "{{ target }}"
                  station: "{{ station }}"
                  style: "{{ style }}"
                  period: "{{ beat | round(3) }}"
            - action: logbook.log
              data:
                name: Светомузыка
                message: "{{ q }} — {{ bpm }} BPM (темп {{ tempo }}), {{ genres or 'жанр ?' }}, {{ style }}"
            - wait_for_trigger:
                - trigger: state
                  entity_id: input_boolean.svetomuzyka
                  to: "off"
                - trigger: template
                  id: track
                  value_template: "{{ (state_attr(station, 'media_title') or '') != title }}"
                - trigger: template
                  value_template: "{{ not is_state(station, 'playing') }}"
                  for: 3
              timeout: "00:15:00"
            # A track started from the phone shows up as "paused" with the new
            # title for a moment, then plays.
            - if: "{{ wait.trigger and wait.trigger.id == 'track' }}"
              then:
                - wait_template: "{{ is_state(station, 'playing') }}"
                  timeout: 5
            - if: "{{ not is_state(station, 'playing') }}"
              then:
                - action: input_boolean.turn_off
                  target: { entity_id: input_boolean.svetomuzyka }
      - action: script.turn_off
        target: { entity_id: script.light_music_show }
      # Two passes: lamp 1 has a weak link and drops unicasts under load;
      # a groupcast off reaches it.
      - repeat:
          count: 2
          sequence:
            - delay: 2
            - if: "{{ was_off }}"
              then:
                - action: light.turn_off
                  target: { entity_id: "{{ target }}" }
              else:
                - action: scene.turn_on
                  target: { entity_id: scene.light_music_before }

script:
  light_music_show:
    alias: Светомузыка — цвета
    mode: restart
    fields:
      target:
        description: Лампа или zigbee-группа
      station:
        description: Станция — по её громкости яркость
      style:
        description: energy, mid или calm
      period:
        description: Секунд между командами
    sequence:
      - variables:
          hues: >-
            {{ [200, 215, 230, 250, 270, 290, 310, 330, 15, 30, 15, 330, 300, 260, 230]
               if style == 'calm' else [0, 30, 55, 120, 180, 220, 280, 320] }}
      # ponytail: 2000 тактов ≈ 20–30 мин — страховка, если автоматизация не остановит.
      - repeat:
          count: 2000
          sequence:
            - variables:
                i: "{{ repeat.index }}"
                hue: >-
                  {{ hues[i % hues | count] if style == 'calm'
                     else hues[(i * 3) % hues | count] }}
                # Louder — brighter: volume 0.6 gives 82 % of the base (owner: 15–20 % dimmer).
                dim: "{{ (state_attr(station, 'volume_level') or 0.6) | float(0.6) * 1.37 }}"
            - action: light.turn_on
              target: { entity_id: "{{ target }}" }
              data:
                hs_color: "{{ [hue, 70 if style == 'calm' else 100] }}"
                brightness_pct: >-
                  {% set base = (40 if i % 2 else 20) if style == 'calm'
                       else (60 if i % 2 else 35) if style == 'mid'
                       else (70 if i % 2 else 25) %}
                  {{ [3, [100, (base * dim) | round(0) | int] | min] | max }}
                # Every style pulses on the beat (owner: calm looked unrelated to the music).
                transition: "{{ (period / 2) | round(2) if style != 'energy' else 0 }}"
            - delay:
                milliseconds: "{{ (period | float * 1000) | int }}"
