# Dashboards are defined in YAML so they are reproducible and backed up.
lovelace:
  mode: storage
  dashboards:
    iot-weather:
      mode: yaml
      title: Weather
      icon: mdi:weather-partly-rainy
      show_in_sidebar: true
      filename: dashboards/weather.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
