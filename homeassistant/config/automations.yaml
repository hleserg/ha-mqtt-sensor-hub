- id: mqtt_round_trip_probe
  alias: MQTT round trip probe
  description: 'Publishes a timestamp to monitor/roundtrip once a minute and expects
    to receive it back through the broker. sensor.mqtt_round_trip_age measures the
    delay; binary_sensor.mqtt_round_trip_failing trips after three missed cycles.
    This is the end-to-end check that HA <-> Mosquitto still works, including authentication
    and the ACL.

    '
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  actions:
  - action: mqtt.publish
    data:
      topic: monitor/roundtrip
      payload: '{{ now().isoformat() }}'
      qos: 0
      retain: false
- id: outdoor_station_went_stale
  alias: Outdoor station went stale or offline
  description: 'Logs a persistent notification when the outdoor weather station stops
    reporting, so a silent sensor is never mistaken for calm weather.

    '
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.outdoor_data_state
    to:
    - stale
    - offline
    for: 00:02:00
  actions:
  - action: persistent_notification.create
    data:
      title: 'Outdoor weather station: {{ states(''sensor.outdoor_data_state'') }}'
      message: 'No fresh measurement for {{ (states(''sensor.outdoor_data_age'') |
        float(0) / 60) | round(0) }} minutes. Last measurement timestamp: {{ states(''sensor.outdoor_last_update'')
        }}.

        '
      notification_id: outdoor_station_stale
- id: outdoor_station_recovered
  alias: Outdoor station recovered
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.outdoor_data_state
    to: fresh
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: outdoor_station_stale
- id: meshcore_mqtt_mirror
  alias: MeshCore -> MQTT mirror
  description: 'Republishes an allow-list of MeshCore node telemetry from the integration''s
    entities into meshcore/<node_id>/<metric>, retained, so consumers that have no
    Home Assistant account (ESP32 watches, shell scripts) can read mesh telemetry
    from the broker. The radio is owned by the integration inside HA, so HA is necessarily
    the publisher here -- see DECISIONS.md D-011.

    Nodes are discovered from the entity ids rather than configured, so swapping the
    Companion (the T114 handover) needs no edit here: a new public key simply starts
    publishing under its own node id. Metrics are an explicit list, never a loop over
    sensor.meshcore_*, because the integration exposes ~190 entities on a busy mesh.

    A metric whose state is unknown or unavailable is skipped rather than published:
    writing "unknown" into a retained topic would destroy the last good value that
    consumers rely on.

    '
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      jobs: "{%- set BAD = ['unknown', 'unavailable', 'none', 'None', ''] -%}\n{%-
        set METRICS = [('battery', 'battery_percentage'),\n                   ('battery_voltage',
        'battery_voltage'),\n                   ('status', 'node_status')] -%}\n{%-
        set RADIO = [('frequency_mhz', 'frequency'),\n                 ('spreading_factor',
        'spreading_factor'),\n                 ('bandwidth_khz', 'bandwidth'),\n                 ('tx_power_dbm',
        'tx_power')] -%}\n{%- set ns = namespace(ids=[], jobs=[]) -%}\n{%- for s in
        states.sensor -%}\n  {%- set m = s.entity_id | regex_findall('^sensor\\.meshcore_([0-9a-f]{6})_battery_voltage')
        -%}\n  {%- if m and m[0] not in ns.ids -%}{%- set ns.ids = ns.ids + [m[0]]
        -%}{%- endif -%}\n{%- endfor -%}\n{%- for node in ns.ids -%}\n  {%- set n
        = namespace(fresh=none, meta={}, any=false, anchor=none) -%}\n  {%- for leaf,
        src in METRICS -%}\n    {%- set cand = states.sensor | map(attribute='entity_id')\n
        \                  | select('search', '^sensor\\.meshcore_' ~ node ~ '_' ~
        src ~ '(_|$)') | list -%}\n    {%- if cand and states(cand[0]) not in BAD
        -%}\n      {%- set ns.jobs = ns.jobs + [{'t': 'meshcore/' ~ node ~ '/' ~ leaf,
        'p': states(cand[0])}] -%}\n      {%- set lu = states[cand[0]].last_updated
        -%}\n      {%- if n.fresh is none or lu > n.fresh -%}{%- set n.fresh = lu
        -%}{%- endif -%}\n      {%- set n.any = true -%}\n      {%- set n.anchor =
        cand[0] -%}\n    {%- endif -%}\n  {%- endfor -%}\n  {%- if n.any -%}\n    {%-
        for key, src in RADIO -%}\n      {%- set cand = states.sensor | map(attribute='entity_id')\n
        \                    | select('search', '^sensor\\.meshcore_' ~ node ~ '_'
        ~ src ~ '(_|$)') | list -%}\n      {%- if cand and states(cand[0]) not in
        BAD -%}\n        {%- set n.meta = n.meta | combine({key: states(cand[0]) |
        float(default=0)}) -%}\n      {%- endif -%}\n    {%- endfor -%}\n    {%- set
        n.meta = n.meta | combine({\n          'node_id': node,\n          'name':
        device_attr(n.anchor, 'name_by_user') or device_attr(n.anchor, 'name') or
        node,\n          'source': 'meshcore-ha',\n          'transport': 'tcp'})
        -%}\n    {%- set ns.jobs = ns.jobs + [{'t': 'meshcore/' ~ node ~ '/meta',
        'p': n.meta | tojson}] -%}\n    {%- if n.fresh is not none -%}\n      {%-
        set ns.jobs = ns.jobs + [{'t': 'meshcore/' ~ node ~ '/last_seen', 'p': n.fresh.isoformat()}]
        -%}\n    {%- endif -%}\n  {%- endif -%}\n{%- endfor -%}\n{{ ns.jobs | tojson
        }}"
  - repeat:
      for_each: '{{ jobs }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: '{{ repeat.item.t }}'
          payload: '{{ repeat.item.p }}'
          qos: 1
          retain: true
- id: bath_presence_v1
  alias: Ванная по присутствию
  description: Присутствие — свет в ванной (клавиша L2 «Ванная выключатель»); минуту никого
    — выкл (датчик сам держит присутствие ещё 60 с). Вытяжка — packages/vannaya.yaml.
  triggers:
  - trigger: state
    entity_id: binary_sensor.0xa4c138869ecdc59b_presence
    to: 'on'
    id: occupied
  - trigger: state
    entity_id: binary_sensor.0xa4c138869ecdc59b_presence
    to: 'off'
    for: 00:01:00
    id: empty
  conditions: &not_away
  # Дома пусто (packages/doma.yaml) — только гасим
  - condition: or
    conditions:
    - condition: trigger
      id: empty
    - condition: state
      entity_id: input_boolean.doma_pusto
      state: 'off'
  actions:
  - action: "light.turn_{{ 'off' if trigger.id == 'empty' else 'on' }}"
    target:
      entity_id: light.svet_v_vannoi
  mode: restart

- id: hall_presence_v1
  alias: Прихожая и коридор по движению
  description: Движение — свет в прихожей и коридоре (клавиши L1/L2 «Прихожая выключатель»,
    обычные лампы, без цвета); минуту нет движения — выкл.
  triggers:
  - trigger: state
    entity_id: binary_sensor.0xa4c138e91ed0ad14_occupancy
    to: 'on'
    id: occupied
  - trigger: state
    entity_id: binary_sensor.0xa4c138e91ed0ad14_occupancy
    to: 'off'
    for: 00:01:00
    id: empty
  conditions: *not_away
  actions:
  - action: "light.turn_{{ 'off' if trigger.id == 'empty' else 'on' }}"
    target:
      entity_id:
      - light.prihozhaya
      - light.svet_v_koridore
  mode: restart
