# =============================================================================
#  Mosquitto — doctor (192.168.1.51), iot-stack
# =============================================================================
#  Anonymous access is off. Every client authenticates and is confined by
#  /mosquitto/config/acl.conf. See MQTT.md for the topic contract.
# =============================================================================

# One global set of security settings for every listener below.
per_listener_settings false

# ------------------------------------------------------------------ listener -
# Bound to 0.0.0.0 on purpose: doctor's LAN address may change, and the
# LAN-only restriction is enforced in the DOCKER-USER iptables chain
# (firewall/docker-user-lan-only.sh), not by binding. Never port-forward 1883.
listener 1883 0.0.0.0
protocol mqtt

# --- Optional websocket listener for browser clients. Off by default: the
# --- ESP32-S3 watches speak plain MQTT and every extra port is extra surface.
# --- If enabled, extend the firewall script to cover 9001 as well.
# listener 9001 0.0.0.0
# protocol websockets

# ------------------------------------------------------------------ security -
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# ------------------------------------------------------------- persistence --
# Retained messages and queued QoS>0 traffic survive a restart. This is what
# lets a watch that just woke up get the last weather values immediately.
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 60

# ---------------------------------------------------------------- logging ---
# stdout -> `docker logs` / dozzle; the file keeps history across restarts.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# ---------------------------------------------------------------- limits ----
retain_available true
max_queued_messages 1000
max_packet_size 262144
max_keepalive 300
# Battery devices (watches, collectors) reconnect a lot; keep sessions cheap.
persistent_client_expiration 14d
