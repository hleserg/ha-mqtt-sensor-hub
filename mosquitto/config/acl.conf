# =============================================================================
#  Mosquitto ACL — doctor iot-stack
# =============================================================================
#  Rules are per-user. Anything not listed is denied: there is no default-allow
#  section and anonymous access is disabled in mosquitto.conf.
#
#  `topic read X`  — may subscribe/receive X
#  `topic write X` — may publish X
#  `%c` expands to the client id, `%u` to the username.
#
#  Reload after editing:  docker compose exec mosquitto kill -HUP 1
#  Full contract:         MQTT.md
# =============================================================================

# --------------------------------------------------------- home assistant ---
# Reads every telemetry namespace; owns the discovery prefix and its own
# automation/control namespace.
user homeassistant
topic read weather/#
topic read weather_state/#
topic read sensors/#
# Home Assistant owns the RF allow-list: script.rf_enable_sensor publishes the
# retained enable/disable commands that collectors replay on reconnect.
topic write sensors/+/cmd/#
topic read meshcore/#
# X5 mirror: the MeshCore radio is owned by the integration *inside* Home
# Assistant, so HA is the only process that can see mesh telemetry at all.
# It republishes an explicit allow-list of node metrics into meshcore/ so
# watches and scripts can read them without an HA account. That makes HA a
# writer here as well as a reader -- see DECISIONS.md D-011. The separate
# `meshcore` account keeps its write grant and stays reserved for a future
# standalone publisher (a USB repeater feeding MQTT directly).
topic write meshcore/#
topic read rtl_433/#
# The normalized observation layer (MQTT.md §13). HA reads it, never writes it:
# observed/ is produced by the normalizer, so nothing in the UI can masquerade
# as something a receiver actually heard.
topic read observed/#
topic read radio/#
# My own Wi-Fi sensors (MQTT.md §14). Read-only here for the same reason as
# observed/: HA must never be able to write something a sensor did not measure.
topic read own/#
topic readwrite homeassistant/#
topic readwrite ha/#
topic write weather_state/#
topic readwrite monitor/#
topic read $SYS/#

# ------------------------------------------------------- weather collector ---
# My own outdoor weather sensors. Publishes only into weather/.
user weather_collector
topic write weather/#
topic read weather/#

# ------------------------------------------------------------ RF/BLE collector
# The rebuilt Tuya IR/RF remote. Publishes normalized telemetry into sensors/
# and its own MQTT Discovery configs into homeassistant/.
user rf_collector
topic write sensors/#
topic read sensors/#
topic write homeassistant/#
# Packet-level observations, not retained (MQTT.md §13). Separate from the
# decoded values above so that raw volume never lands in the state namespace.
topic write radio/raw/#

# ------------------------------------------------------------ ESP32-S3 watch --
# Read-only for weather. May publish its own status under watch/<client-id>/.
user watch
topic read weather/#
topic read weather_state/#
topic read observed/#
# Its write grant is the `pattern` rule at the bottom of this file, not here --
# pattern rules are global in Mosquitto and only *look* scoped when written
# inside a user block.

# ------------------------------------------------------------ weather engine --
# Consumes measurements, publishes derived state. Never writes raw weather/.
user weather_engine
topic read weather/#
topic read weather_state/#
topic read sensors/#
topic read observed/#
topic read own/#
topic read meshcore/#
topic read rtl_433/#
topic write weather_state/#

# ------------------------------------------------------------------ meshcore --
# MeshCore integration / bridge publishing node + environmental telemetry.
user meshcore
topic write meshcore/#
topic read meshcore/#
topic write homeassistant/#
# meshcore-ha's packet feed, when it is enabled: transport-level data goes to
# the raw layer, never into meshcore/ where measurements live (DECISIONS.md D-003).
topic write radio/raw/meshcore/#

# ------------------------------------------------------------------- rtl_433 --
# Optional RTL-SDR bridge. Raw decodes only, plus its discovery configs.
user rtl433
topic write rtl_433/#
topic read rtl_433/#
topic write homeassistant/#

# --------------------------------------------------------------- normalizer ---
# Reads every observation layer, owns the normalized one. NOT YET DEPLOYED —
# there is one collector, so there is nothing to deduplicate (MQTT.md §13).
# The rules are here so that standing the service up is one
# `scripts/add-mqtt-user.sh normalizer` and a restart, with no ACL surprise.
# Rules for a user with no password entry simply never match, so this is inert.
user normalizer
topic read radio/#
topic read sensors/#
topic read meshcore/#
topic read rtl_433/#
topic write observed/#
topic write homeassistant/#

# ------------------------------------------------------------------ monitor ---
# Healthchecks and the MQTT round-trip test. No access to real telemetry.
user monitor
topic readwrite monitor/#
topic read $SYS/#
# One exception, and it is a liveness flag rather than a measurement: the
# weather engine's last-will topic. `healthcheck.sh` asks the bus whether the
# engine is online, because a wedged process still looks fine to `docker ps`.
# Granted as a single topic, not `weather_state/#` -- the rule above stays true.
topic read weather_state/engine_status

# =============================================================================
#  Pattern rules -- GLOBAL
# =============================================================================
#  These are deliberately at the bottom and outside every `user` block, because
#  that is what they actually are. From mosquitto.conf(5):
#
#      "Pattern ACLs apply to all users even if the `user` keyword has
#       previously been given."
#
#  A pattern rule written inside a user block behaves identically to one written
#  here -- it just reads as though it were scoped, which is worse than useless
#  in a file whose entire job is to say who may touch what.
#
#  `%u` is the authenticated username, `%c` the client id. The substitution must
#  be the whole topic level: `own/%u/#` is valid, `own_%u/#` is not.

# My own sensors: one broker account per physical sensor, named exactly as its
# sensor_id, and each one can reach its own subtree and nothing else. Adding a
# sensor is therefore `scripts/add-mqtt-user.sh <sensor_id>` and a reload -- no
# edit to this file, and no chance of a copy-paste that grants own/# to one node.
#
# Consequence of the global scope above, stated rather than hidden: every
# existing service account also matches these two lines, so `rf_collector`
# could write `own/rf_collector/...`. Nothing reads that topic and no entity is
# created from `own/#` except by explicit YAML, so the cost is a stray topic,
# not a false measurement. The alternative -- an explicit block per sensor --
# was rejected because a hand-written grant per sensor is the more likely
# mistake of the two.
pattern write own/%u/#
pattern read own/%u/#

# The ESP32-S3 watch publishes its own status under its client id.
pattern write watch/%c/#
