# =============================================================================
#  rtl_433 -> MQTT   (optional, disabled by default)
# =============================================================================
#  Only used when an RTL-SDR dongle is plugged into doctor and the stack is
#  started with:   docker compose --profile rtl433 up -d
#
#  No SDR is attached today. The core stack must never depend on this file.
#
#  Fill in MQTT credentials before enabling: the rtl433 account and its
#  password are in .env (RTL433_MQTT_USER / RTL433_MQTT_PASSWORD).
# =============================================================================

# ------------------------------------------------------------------- radio --
# 433.92 MHz is the common band for cheap outdoor weather sensors.
# For 868 MHz devices add a second: frequency 868.3M  (rtl_433 will hop).
frequency     433.92M
sample_rate   250k
# gain        40            # leave commented for AGC
# ppm_error   0

# Decode everything at first so unknown sensors can be identified, then narrow
# this down with `protocol <n>` lines once the interesting ones are known.
# Narrowing matters: it is what keeps the band from becoming entity noise.
# protocol 12      # Oregon Scientific
# protocol 40      # Acurite 592TXR
# protocol 74      # LaCrosse TX141

# ---------------------------------------------------------------- reporting -
report_meta   time:iso:usec
report_meta   protocol
report_meta   level
convert       si

# ----------------------------------------------------------------- outputs --
# Namespace is reserved and documented in MQTT.md:
#   rtl_433/<model>/<id>/<metric>
# Raw decodes are NOT retained — they are transient events, not state.
#
# Replace USER and PASSWORD with the values from .env before enabling.
output mqtt://mosquitto:1883,user=rtl433,pass=REPLACE_ME,retain=0,devices=rtl_433[/model][/id]

# Human-readable copy in the container log for debugging.
output log
